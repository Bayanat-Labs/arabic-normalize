name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with test extras
        run: python -m pip install -e ".[test]"
      - name: Run the tests (fixtures, UAX 15 conformance, properties, CLI)
        run: python -m pytest
      - name: Check generated tables and docs are up to date
        run: |
          python scripts/build_tables.py --check
          python scripts/make_docs.py --check

  build:
    name: Build and install check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: |
          python -m pip install build==1.3.0 twine==6.2.0
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel in a clean environment, run the CLI and the tests against it
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl pytest jsonschema
          cd "$RUNNER_TEMP"
          echo "إِلَى المَدْرَسَةِ الجَدِيدَةِ ١٢٣" | "$RUNNER_TEMP/wheel-env/bin/arnorm" normalize
          "$RUNNER_TEMP/wheel-env/bin/arnorm" version
          "$RUNNER_TEMP/wheel-env/bin/python" -m pytest "$GITHUB_WORKSPACE/tests" -p no:cacheprovider

  javascript:
    name: JavaScript port (Node on the runner image)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generated data matches the Python package files
        working-directory: js
        run: |
          node --version
          node scripts/build.mjs --check
      - name: Tests (conformance with the Python reference, rejected inputs, UCD tables, NormalizationTest.txt, properties)
        working-directory: js
        run: node --test test/*.test.mjs
      - name: Conformance counts are up to date
        working-directory: js
        run: node scripts/conformance_counts.mjs --check
      - name: Python reference outputs are up to date
        run: |
          python3 -I js/scripts/make_reference.py
          git diff --exit-code js/test/reference/python-reference.json
      - name: Package builds
        working-directory: js
        run: npm pack --dry-run
